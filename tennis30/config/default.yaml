# Tennis30 - Default Configuration
# Multi-Pass Precision Tennis Tracking System

project:
  name: "tennis30"
  version: "1.0.0"
  description: "Multi-Pass Precision Tennis Tracking"

# Environment settings
environment:
  device: "cuda"  # cuda or cpu
  num_workers: 4
  seed: 42

# File paths (can be overridden with environment variables)
paths:
  data_root: "./data"
  models_dir: "${paths.data_root}/models"
  raw_videos: "${paths.data_root}/raw"
  processed: "${paths.data_root}/processed"
  output: "./output"

# Video processing settings
video:
  fps: 30
  target_resolution: [1920, 1080]  # [width, height]
  codec: "mp4v"

# Court detection configuration
court:
  method: "resnet50"  # resnet50, hough, or ensemble
  confidence_threshold: 0.7
  court_type: "singles"  # singles or doubles
  visualize: false

  dimensions:
    length: 23.77  # meters
    width_singles: 8.23
    width_doubles: 10.97
    service_line_distance: 6.40
    net_height: 0.914

# Ball tracking configuration
ball_tracking:
  # Ensemble fusion settings
  ensemble:
    enabled: true
    spatial_clustering:
      radius: 10  # pixels
      min_models: 2  # minimum models that must agree

    # Individual model configurations
    tracknet:
      enabled: true
      weight: 0.30  # 30% voting power
      threshold: 0.5
      model_path: "${paths.models_dir}/tracknet_best.pth"
      input_size: [512, 512]
      batch_size: 8

    yolo_v1:
      enabled: true
      weight: 0.25  # 25% voting power
      threshold: 0.3
      model_path: "${paths.models_dir}/yolov8n_tennis_v1.pt"
      input_size: [640, 640]
      batch_size: 16

    yolo_v2:
      enabled: true
      weight: 0.25  # 25% voting power
      threshold: 0.3
      model_path: "${paths.models_dir}/yolov8n_tennis_v2.pt"
      input_size: [640, 640]
      batch_size: 16

    samurai:
      enabled: true
      weight: 0.15  # 15% voting power
      threshold: 0.4
      checkpoint: "${paths.models_dir}/sam2.1_hiera_large.pt"
      use_motion_memory: true
      memory_bank_size: 16

    faster_rcnn:
      enabled: true
      weight: 0.05  # 5% voting power
      threshold: 0.6
      model_path: "${paths.models_dir}/fasterrcnn_resnet50.pth"
      batch_size: 4

  # Multi-pass refinement
  precision_pipeline:
    num_passes: 4

    # Pass 2: Temporal refinement
    temporal:
      window_size: 15  # frames
      kalman_smoothing: "bidirectional"  # forward, backward, or bidirectional
      interpolation_method: "cubic"  # linear, cubic, or physics
      max_gap_frames: 10

    # Pass 3: Physics validation
    physics:
      enabled: true
      gravity: 9.81  # m/s²
      drag_coefficient: 0.55  # tennis ball
      air_density: 1.225  # kg/m³
      ball_mass: 0.058  # kg
      ball_radius: 0.033  # meters
      bounce_damping: 0.75
      max_ball_velocity: 180  # km/h
      min_trajectory_points: 5

    # Pass 4: Cross-validation
    validation:
      min_quality_score: 0.5
      outlier_threshold: 3.0  # standard deviations

# Player tracking configuration
player_tracking:
  method: "yolov8"  # yolov8 or faster_rcnn
  max_players: 2
  confidence_threshold: 0.5

  yolo:
    model_path: "${paths.models_dir}/yolov8n.pt"
    batch_size: 16

  faster_rcnn:
    model_path: "${paths.models_dir}/fasterrcnn_resnet50.pth"
    confidence_threshold: 0.85
    batch_size: 4

  # SORT tracking
  tracking:
    max_age: 30  # frames
    min_hits: 3
    iou_threshold: 0.3

# Pose estimation configuration
pose_estimation:
  enabled: true
  ensemble: true

  # Model weights for ensemble
  yolo_pose:
    enabled: true
    weight: 0.30
    model_path: "${paths.models_dir}/yolov8x-pose.pt"
    confidence_threshold: 0.3
    keypoint_format: "coco_17"

  mediapipe:
    enabled: true
    weight: 0.30
    model_complexity: 2  # 0=lite, 1=full, 2=heavy
    min_detection_confidence: 0.5
    min_tracking_confidence: 0.5
    keypoint_format: "mediapipe_33"

  hrnet:
    enabled: false  # Optional - more accurate but slower
    weight: 0.25
    model_path: "${paths.models_dir}/hrnet_w48_coco.pth"
    keypoint_format: "coco_17"

  alphapose:
    enabled: false  # Optional
    weight: 0.15
    model_path: "${paths.models_dir}/alphapose_fastres50.pth"
    keypoint_format: "alphapose_26"

  # Temporal smoothing
  temporal_smoothing:
    enabled: true
    window_size: 5
    method: "moving_average"  # moving_average or kalman

  # Biomechanical constraints
  constraints:
    enabled: true
    max_limb_length_change: 0.1  # 10% per frame
    min_joint_angle: 0  # degrees
    max_joint_angle: 180

# Physics engine configuration
physics:
  gravity: 9.81
  drag_coefficient: 0.55
  air_density: 1.225
  ball_properties:
    mass: 0.058  # kg
    radius: 0.033  # meters
    restitution: 0.75  # bounce coefficient

# Bounce detection
bounce_detection:
  enabled: true
  classifier_path: "${paths.models_dir}/bounce_classifier.pkl"
  velocity_threshold: 50  # km/h minimum for bounce
  height_threshold: 0.1  # meters minimum height change

# Game state tracking
game_state:
  enabled: true
  detect_rallies: true
  detect_serves: true
  count_shots: true

  rally_detection:
    min_duration: 1.0  # seconds
    min_shots: 2

  serve_detection:
    height_threshold: 2.0  # meters
    velocity_threshold: 100  # km/h

# Visualization settings
visualization:
  enabled: true
  draw_court: true
  draw_ball_trajectory: true
  draw_player_bbox: true
  draw_player_pose: true
  draw_mini_court: true

  colors:
    ball: [0, 255, 255]  # yellow
    player1: [0, 255, 0]  # green
    player2: [255, 0, 0]  # blue
    court: [255, 255, 255]  # white
    trajectory: [0, 255, 255]  # yellow

  trajectory:
    max_trail_length: 30  # frames
    line_thickness: 2

# Export settings
export:
  formats: ["csv", "json"]  # csv, json, unity, unreal

  csv:
    ball_file: "ball_data.csv"
    player1_file: "player1_data.csv"
    player2_file: "player2_data.csv"
    game_state_file: "game_state.csv"

  json:
    pretty_print: true
    indent: 2

  unity:
    coordinate_system: "left_handed"
    scale: 1.0

  unreal:
    coordinate_system: "left_handed"
    scale: 100.0  # cm

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_file: "${paths.output}/tennis30.log"
  console: true

# Performance settings
performance:
  use_mixed_precision: true
  compile_models: false  # torch.compile (PyTorch 2.0+)
  optimize_memory: true
  prefetch_frames: true
  prefetch_size: 32
