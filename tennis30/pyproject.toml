[tool.poetry]
name = "tennis30"
version = "1.0.0"
description = "Tennis30 - Multi-Pass Precision Tennis Tracking System"
authors = ["Tennis30 Team"]
readme = "README.md"
homepage = "https://github.com/szkipi/T"
repository = "https://github.com/szkipi/T"
keywords = ["tennis", "tracking", "computer-vision", "sports-analytics", "pose-estimation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[tool.poetry.dependencies]
python = "^3.9"
# Core dependencies
torch = "^2.1.0"
torchvision = "^0.16.0"
numpy = "^1.24.0"
opencv-python = "^4.8.0"
scipy = "^1.11.0"
scikit-learn = "^1.3.0"
# Computer vision models
ultralytics = "^8.0.0"  # YOLOv8
# Configuration
pyyaml = "^6.0"
hydra-core = "^1.3.0"
omegaconf = "^2.3.0"
# CLI
typer = {extras = ["all"], version = "^0.9.0"}
rich = "^13.0.0"
# Data handling
pandas = "^2.0.0"
pillow = "^10.0.0"
# Progress bars
tqdm = "^4.65.0"
# Misc utilities
python-dotenv = "^1.0.0"
h5py = "^3.9.0"  # For Keras weights conversion

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"
# Code quality
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
pylint = "^2.17.0"
# Pre-commit hooks
pre-commit = "^3.3.0"
# Documentation
mkdocs = "^1.5.0"
mkdocs-material = "^9.0.0"
mkdocstrings = {extras = ["python"], version = "^0.22.0"}
# Jupyter
jupyter = "^1.0.0"
ipykernel = "^6.25.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"

[[tool.poetry.packages]]
include = "tennis30"

[tool.poetry.scripts]
tennis30 = "tennis30.cli.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=tennis30 --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "ultralytics.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tennis30"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
